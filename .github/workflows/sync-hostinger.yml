name: Sync Hostinger repository

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hostinger mirror
        env:
          SYNC_TOKEN: ${{ secrets.HOSTINGER_SYNC_TOKEN }}
        run: |
          git config user.name "Toolclave deployment sync"
          git config user.email "actions@github.com"
          git remote add hostinger "https://PrajaktaAdlytica:${SYNC_TOKEN}@github.com/PrajaktaAdlytica/toolclave-hostinger.git"
          git push hostinger HEAD:main --force
