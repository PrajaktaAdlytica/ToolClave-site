name: Sync Hostinger repository

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hostinger mirror
        env:
          SYNC_SSH_KEY: ${{ secrets.HOSTINGER_SYNC_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SYNC_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config user.name "Toolclave deployment sync"
          git config user.email "actions@github.com"
          git remote add hostinger "git@github.com:PrajaktaAdlytica/toolclave-hostinger.git"
          git push hostinger HEAD:main --force
